<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="https://cdn.discordapp.com/emojis/1525949441100480702.webp?size=96">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050505;
      color: white;
      font-family: 'Manrope', sans-serif;
    }

    .router-loading {
      text-align: center;
      opacity: 0.4;
    }

    .router-loading .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: white;
      margin: 0 3px;
      animation: dotPulse 1.2s ease-in-out infinite;
    }

    .router-loading .dot:nth-child(2) { animation-delay: 0.15s; }
    .router-loading .dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* 404 styles inline para não precisar de CSS externo */
    .notfound-page {
      width: 100%;
      height: 100vh;
      background:
        linear-gradient(to top, rgba(145,145,145,0.493), rgba(0,0,0,0.596)),
        url("https://i.pinimg.com/736x/b9/f6/fb/b9f6fb42bf176d06de708bc564fa29a8.jpg");
      background-size: cover;
      background-position: center;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      font-family: sans-serif;
    }

    .notfound-content {
      display: flex;
      align-items: center;
      gap: 60px;
      z-index: 2;
    }

    .astronaut {
      width: 180px;
      animation: float 4s ease-in-out infinite;
    }

    .notfound-text h2 { color: white; font-size: 50px; font-weight: 400; }
    .notfound-text h1 { color: white; font-size: 180px; line-height: 1; }
    .notfound-text p { color: white; opacity: .8; font-size: 20px; margin-top: 10px; margin-bottom: 30px; }

    .back-home {
      color: white;
      text-decoration: none;
      border: 2px solid white;
      padding: 12px 28px;
      border-radius: 999px;
      transition: .25s;
    }

    .back-home:hover { background: white; color: black; }

    @keyframes float {
      0%   { transform: translateY(0px); }
      50%  { transform: translateY(-20px); }
      100% { transform: translateY(0px); }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>

<body>

  <div class="router-loading" id="loading">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

  <script>

    // =========================================================
    // ROUTER — Detecta o template do perfil e redireciona
    // pro layout independente correspondente
    // =========================================================

    (async function () {

      // Pega o username da URL
      const params = new URLSearchParams(window.location.search);
      let username = params.get("user");

      if (!username) {
        username = window.location.pathname.replace("/", "").trim();
      }

      if (!username || username === "u.html") {
        showNotFound();
        return;
      }

      // Busca APENAS o template do perfil (query leve)
      const { data, error } = await supabaseClient
        .from("profiles")
        .select("template")
        .eq("username", username)
        .single();

      if (error || !data) {
        showNotFound();
        return;
      }

      // Mapa de template → pasta do layout
      const layoutMap = {
        "cardking":      "normal",
        "cardkingdois":  "centralizado",
        "template3":     "grande",
        "template4":     "minimalista"
      };

      const template = data.template || "cardking";
      const layout = layoutMap[template] || "normal";

      // Redireciona pro layout correto (sem poluir histórico)
      window.location.replace(
        `/layouts/${layout}/${layout}.html?user=${encodeURIComponent(username)}`
      );

    })();

    function showNotFound() {

      document.getElementById("loading").style.display = "none";

      document.body.innerHTML = `
        <div class="notfound-page">
          <div class="notfound-content">
            <img
              class="astronaut"
              src="https://i.pinimg.com/originals/42/c6/2a/42c62a68fa0154599d1da42a43ac6dcd.gif"
            >
            <div class="notfound-text">
              <h2>Oops!</h2>
              <h1>404</h1>
              <p>
                Perfil não encontrado<br>
                ou inexistente.
              </p>
              <a href="https://teammayhem.vercel.app" class="back-home">
                Voltar ao início
              </a>
              <br><br><br>
              <a href="https://teammayhem.vercel.app/cadastro.html" class="back-home">
                Criar perfil
              </a>
            </div>
          </div>
        </div>
      `;

    }

  </script>

</body>

</html>
